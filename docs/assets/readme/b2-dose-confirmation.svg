<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">B2 development dose response and isolated confirmation</title>
  <desc id="desc">Medical and General Controller deltas are plotted across B2 accepted checkpoints. A paired-effect forest plot contrasts the development-selected step with the six-hundred-question confirmation isolated from B2 training and model selection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC',
           'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
    .figure-title { font-size: 28px; font-weight: 700; }
    .figure-subtitle { font-size: 16px; fill: #475569; }
    .panel-title { font-size: 19px; font-weight: 700; }
    .box-title { font-size: 18px; font-weight: 700; }
    .box-copy { font-size: 16px; fill: #475569; }
    .label { font-size: 16px; }
    .small { font-size: 15px; fill: #475569; }
    .axis { font-size: 15px; fill: #475569; }
    .axis-title { font-size: 16px; font-weight: 600; fill: #0f172a; }
    .value { font-size: 16px; font-weight: 700; }
    .note { font-size: 15px; fill: #475569; }
    .flow { stroke-linecap: round; stroke-linejoin: round; }
    </style>
